name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint · Migrate · Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: yatratrack
          POSTGRES_PASSWORD: yatratrack_dev
          POSTGRES_DB: yatratrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yatratrack -d yatratrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: dev
      APP_TIMEZONE: Asia/Kolkata
      SECRET_KEY: ci_test_secret_key_at_least_32_bytes_long_abcdefgh
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://yatratrack:yatratrack_dev@localhost:5432/yatratrack
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT: "30"
      REDIS_URL: redis://localhost:6379/0
      ACCESS_TOKEN_TTL_MIN: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"
      ACCOUNT_LOCKOUT_THRESHOLD: "5"
      ACCOUNT_LOCKOUT_TTL_MIN: "15"
      BCRYPT_ROUNDS: "4"
      RESEND_API_KEY: ""
      EMAIL_FROM: "YatraTrack <no-reply@yatratrack.in>"
      STADIA_API_KEY: ""
      MAPTILER_API_KEY: ""
      SENTRY_DSN: ""
      LOG_LEVEL: WARNING
      LOG_RETENTION_DAYS: "30"
      TRIP_AUTOGEN_ENABLED: "true"
      TRIP_AUTOGEN_HOUR: "6"
      SCHOOL_HOURS_START: "6"
      SCHOOL_HOURS_END: "18"
      GPS_FLUSH_INTERVAL_SEC: "30"
      GPS_STALE_THRESHOLD_SEC: "30"
      GPS_RETENTION_DAYS: "90"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (including dev)
        working-directory: backend
        run: uv sync --frozen

      - name: Lint — ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Migrate — alembic upgrade head
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Test — pytest
        working-directory: backend
        # Coverage gate: lenient at 0 for now; tighten to 70 in Chunk 2+ (spec §19).
        # Add --cov-fail-under=70 once auth + entity tests land.
        run: uv run pytest -v --cov=app --cov-report=term-missing
