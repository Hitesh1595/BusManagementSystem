services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: yatratrack
      POSTGRES_PASSWORD: yatratrack_dev
      POSTGRES_DB: yatratrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yatratrack -d yatratrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # Override host-oriented URLs from .env with docker-internal hostnames
      DATABASE_URL: postgresql+asyncpg://yatratrack:yatratrack_dev@db:5432/yatratrack
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

volumes:
  pgdata:
  redisdata:
